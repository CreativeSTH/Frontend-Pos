<div class="app-aurora"><span class="app-aurora__spot"></span></div>

@if (auth.enModoSoporte()) {
  <div class="modo-soporte-bar">
    <ds-icon name="layers" [size]="16" />
    <span>Estás operando este negocio en modo soporte, como su Administrador.</span>
    <button type="button" class="modo-soporte-bar__salir" (click)="auth.salirModoSoporte()">Salir</button>
  </div>
}

<app-banner-verificar-email />
<app-banner-riesgo-pago />
<app-banner-dias-restantes-trial />

<div class="dashboard-shell">
  <app-sidebar />
  <main class="dashboard-shell__content">
    <router-outlet />
  </main>
</div>

@if (mostrarVolverPos()) {
  <a routerLink="/punto-venta" class="volver-pos-fab">
    <ds-icon name="shopping-bag" [size]="18" />
    <span>Volver a punto de venta</span>
  </a>
}

@if (auth.locked()) {
  <app-lock-screen />
}

<ds-toast-container />
<ds-confirm-dialog />
