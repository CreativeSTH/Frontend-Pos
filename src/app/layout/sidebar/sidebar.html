@if (mobileNav.isOpen()) {
  <div class="sidebar-backdrop" (click)="mobileNav.close()"></div>
}

<aside class="sidebar" [class.sidebar--open]="mobileNav.isOpen()">
  <div class="sidebar__brand" title="POS System">
    <ds-icon name="dashboard" [size]="17" />
  </div>

  <nav class="sidebar__nav">
    @for (item of navItems(); track item.label) {
      @if (item.route) {
        <a
          class="sidebar__item"
          [routerLink]="item.route"
          routerLinkActive="sidebar__item--active"
          [title]="item.label"
          (click)="mobileNav.close()"
        >
          <ds-icon [name]="item.icon" [size]="19" />
        </a>
      } @else {
        <span class="sidebar__item sidebar__item--disabled" [title]="item.label + ' (Pronto)'">
          <ds-icon [name]="item.icon" [size]="19" />
        </span>
      }
    }
  </nav>

  <div class="sidebar__bottom">
    @if (configuracionVisible()) {
      <a
        class="sidebar__item"
        routerLink="/configuracion"
        routerLinkActive="sidebar__item--active"
        title="Configuración"
        (click)="mobileNav.close()"
      >
        <ds-icon name="settings" [size]="19" />
      </a>
    }
    <button type="button" class="sidebar__item sidebar__item--button" title="Cambiar de cajero" (click)="abrirCambioCajero()">
      <ds-icon name="lock" [size]="19" />
    </button>

    <div class="sidebar__temas" title="Tema visual">
      @for (t of temas; track t.valor) {
        <button
          type="button"
          class="sidebar__tema-dot"
          [class.sidebar__tema-dot--active]="themeService.tema() === t.valor"
          [attr.data-tema]="t.valor"
          [title]="t.etiqueta"
          (click)="themeService.cambiarTema(t.valor)"
        ></button>
      }
    </div>

    <div class="sidebar__user" [title]="(auth.usuario()?.nombre ?? '') + ' · ' + (auth.usuario()?.rolNombre ?? '')">
      <ds-avatar [name]="auth.usuario()?.nombre ?? ''" size="sm" />
    </div>
    <button type="button" class="sidebar__item sidebar__item--button sidebar__item--danger" title="Cerrar sesión" (click)="logout()">
      <ds-icon name="log-out" [size]="19" />
    </button>
  </div>
</aside>

@if (showPinModal()) {
  <ds-modal title="Cambiar de cajero" size="sm" (close)="showPinModal.set(false)">
    <p class="sidebar-pin__hint">Ingresa el PIN del cajero que va a tomar el turno.</p>
    <ds-form-field label="PIN">
      <ds-input
        type="password"
        icon="lock"
        [ngModel]="pin()"
        (ngModelChange)="pin.set($event)"
        placeholder="••••"
      />
    </ds-form-field>

    <div modal-footer>
      <ds-button variant="ghost" (click)="showPinModal.set(false)">Cancelar</ds-button>
      <ds-button variant="primary" [loading]="cambiando()" (click)="confirmarPin()">Cambiar</ds-button>
    </div>
  </ds-modal>
}
