<form [formGroup]="form" class="tarjeta-form" (ngSubmit)="tokenizar()" novalidate>
  <ds-form-field label="Número de tarjeta" [error]="errorDe('numero')">
    <ds-input formControlName="numero" placeholder="4242 4242 4242 4242" autocomplete="cc-number" [invalid]="!!errorDe('numero')" />
  </ds-form-field>
  <div class="tarjeta-form__row">
    <ds-form-field label="MM" [error]="errorDe('mesVencimiento')">
      <ds-input formControlName="mesVencimiento" placeholder="09" autocomplete="cc-exp-month" [invalid]="!!errorDe('mesVencimiento')" />
    </ds-form-field>
    <ds-form-field label="AA" [error]="errorDe('anioVencimiento')">
      <ds-input formControlName="anioVencimiento" placeholder="29" autocomplete="cc-exp-year" [invalid]="!!errorDe('anioVencimiento')" />
    </ds-form-field>
    <ds-form-field label="CVC" [error]="errorDe('cvc')">
      <ds-input formControlName="cvc" placeholder="123" autocomplete="cc-csc" [invalid]="!!errorDe('cvc')" />
    </ds-form-field>
  </div>
  <ds-form-field label="Nombre del titular" [error]="errorDe('nombreTitular')">
    <ds-input formControlName="nombreTitular" placeholder="Como aparece en la tarjeta" autocomplete="cc-name" [invalid]="!!errorDe('nombreTitular')" />
  </ds-form-field>

  @if (error()) {
    <p class="tarjeta-form__error" role="alert">{{ error() }}</p>
  }

  <ds-button variant="primary" type="submit" [loading]="tokenizando()">Validar tarjeta</ds-button>
</form>
