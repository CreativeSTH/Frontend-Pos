<div class="suscripcion-vencida">
  <h1>Tu período de prueba/suscripción venció</h1>

  @if (errorCargaEstado()) {
    <p>No pudimos cargar el estado de tu suscripción.</p>
    <ds-button variant="glass" (click)="cerrarSesion()">Cerrar sesión</ds-button>
  } @else if (cargandoEstado()) {
    <p>Cargando...</p>
  } @else {
    @if (suscripcion(); as s) {
      <p>Elegí tu plan y reactivá tu cuenta para seguir usando el sistema.</p>
      <app-selector-plan-pago [suscripcionActual]="s" (pagado)="onPagado()" />
    }

    <button type="button" class="suscripcion-vencida__salir" (click)="cerrarSesion()">Cerrar sesión</button>
  }
</div>
