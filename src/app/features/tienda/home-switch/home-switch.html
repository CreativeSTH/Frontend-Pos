@if (tienda.cargando()) {
  <p class="tienda-cargando">Cargando...</p>
} @else if (!tienda.activa()) {
  <p class="tienda-cargando">Esta tienda no está disponible todavía.</p>
} @else {
  @switch (tienda.plantilla()) {
    @case ('aurora') { <app-aurora-home /> }
    @case ('atelier') { <app-atelier-home /> }
    @case ('foundry') { <app-foundry-home /> }
    @case ('nocturne') { <app-nocturne-home /> }
    @case ('meadow') { <app-meadow-home /> }
    @default { <app-aurora-home /> }
  }
}
