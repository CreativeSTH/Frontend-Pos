<ds-modal [title]="'Historial — ' + titulo()" size="lg" (close)="close.emit()">
  @if (cargando() && !datos()) {
    <div class="ham-cargando"><ds-icon name="clock" [size]="24" /><span>Cargando historial...</span></div>
  } @else if (error()) {
    <ds-empty-state icon="alert-triangle" title="No se pudo cargar el historial" description="Inténtalo de nuevo.">
      <ds-button variant="glass" icon="rotate-ccw" (click)="cargar(1)">Reintentar</ds-button>
    </ds-empty-state>
  } @else if (datos(); as d) {
    @if (d.items.length === 0) {
      <ds-empty-state
        icon="clock"
        title="Sin cambios registrados"
        description="Este registro no tiene cambios desde que se activó la auditoría."
      />
    } @else {
      <app-linea-tiempo-auditoria [registros]="d.items" [mostrarEnlace]="false" />
      @if (d.total > d.porPagina) {
        <div class="ham-paginador">
          <ds-paginator [page]="d.pagina" [totalPages]="totalPaginas(d)" (pageChange)="cargar($event)" />
        </div>
      }
    }
  }
</ds-modal>
